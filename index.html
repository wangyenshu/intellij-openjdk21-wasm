<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IntelliJ IDEA</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         background: #2b2b2b; color: #a9b7c6; font: 15px/1.5 system-ui, sans-serif; }
  main { width: min(360px, 86vw); text-align: center; }
  h1 { margin: 0 0 20px; font-size: 18px; font-weight: 600; color: #fff; }
  #msg { min-height: 3em; margin: 0 0 14px; }
  .err { color: #ff6b6b; }
  #bar { height: 4px; margin: 0 0 16px; border-radius: 2px; background: #3c3f41; overflow: hidden; }
  #bar i { display: block; width: 0; height: 100%; background: #4a88c7; }
  button { font: inherit; color: #fff; background: #365880; border: 0; border-radius: 4px;
           padding: 9px 28px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  button:focus-visible, a:focus-visible { outline: 2px solid #4a88c7; outline-offset: 2px; }
  #rm { display: block; margin-top: 18px; font-size: 12px; color: #808080; }
</style>
</head>
<body>
<main>
  <h1>IntelliJ IDEA</h1>
  <p id="msg">Checking browser support.</p>
  <div id="bar" hidden><i></i></div>
  <button id="go" disabled>Install</button>
  <a id="rm" href="#" hidden>Remove downloaded data</a>
</main>
<script>
(() => {
  'use strict';
  const PREFIX = 'idea-';
  const $ = id => document.getElementById(id);
  const msg = $('msg'), bar = $('bar'), fill = bar.firstElementChild, go = $('go'), rm = $('rm');
  const mb = n => Math.round(n / 1048576);
  let reg, manifest, name, key, action;

  const say = (text, err) => { msg.textContent = text; msg.className = err ? 'err' : ''; };
  const button = (label, fn, off) => { go.textContent = label; go.disabled = !!off; action = fn; };
  go.onclick = () => action && action();

  // Chunks of the manifest that are not in the cache yet.
  async function pending(cache) {
    const have = new Set((await cache.keys()).map(r => r.url));
    return manifest.files
      .flatMap(f => f.chunks)
      .map(c => ({ ...c, url: new URL(c.url, reg.scope).href }))
      .filter(c => !have.has(c.url));
  }

  async function refresh() {
    const cache = (await caches.has(name)) ? await caches.open(name) : null;
    if (cache && await cache.match(key)) {
      say('Installed, ' + mb(manifest.total) + ' MB.');
      button('Launch', launch);
      rm.hidden = false;
      return;
    }
    const left = cache ? (await pending(cache)).reduce((s, j) => s + j.size, 0) : manifest.total;
    const have = manifest.total - left;
    say(have
      ? 'Download interrupted: ' + mb(have) + ' of ' + mb(manifest.total) + ' MB saved.'
      : 'One download of ' + mb(manifest.total) + ' MB, kept in this browser.');
    button(have ? 'Resume' : 'Install', install);
    rm.hidden = !have;
  }

  function launch() {
    button('Starting', null, true);
    location.href = manifest.app;
  }

  async function install() {
    button('Installing', null, true);
    rm.hidden = true;
    bar.hidden = false;
    fill.style.width = '0';
    let failed = false, got = 0, last = 0;
    try {
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
      const cache = await caches.open(name);
      const queue = await pending(cache);
      const need = queue.reduce((s, j) => s + j.size, 0);
      const est = navigator.storage && navigator.storage.estimate ? await navigator.storage.estimate() : null;
      if (est && est.quota && est.quota - est.usage < need) {
        throw new Error('Not enough browser storage: ' + mb(est.quota - est.usage) +
                        ' MB free, ' + mb(need) + ' MB needed.');
      }

      const tick = () => {
        const t = performance.now();
        if (t - last < 100) return;
        last = t;
        fill.style.width = (100 * got / need) + '%';
        say('Downloading ' + mb(got) + ' of ' + mb(need) + ' MB.');
      };

      const fetchChunk = async job => {
        for (let attempt = 1; ; attempt++) {
          let mine = 0;
          try {
            const r = await fetch(job.url, { cache: 'no-store' });
            if (!r.ok) throw new Error('HTTP ' + r.status + ' for ' + job.url);
            const buf = new Uint8Array(job.size);
            const reader = r.body.getReader();
            for (;;) {
              const { done, value } = await reader.read();
              if (done) break;
              if (mine + value.length > job.size) throw new Error('Chunk too large: ' + job.url);
              buf.set(value, mine);
              mine += value.length;
              got += value.length;
              tick();
            }
            if (mine !== job.size) throw new Error('Chunk truncated: ' + job.url);
            if (job.sha256 && window.crypto && crypto.subtle) {
              const d = new Uint8Array(await crypto.subtle.digest('SHA-256', buf));
              const hex = Array.from(d, b => b.toString(16).padStart(2, '0')).join('');
              if (hex !== job.sha256) throw new Error('Checksum mismatch: ' + job.url);
            }
            return buf;
          } catch (e) {
            got -= mine;
            if (attempt >= 3 || failed) throw e;
            await new Promise(res => setTimeout(res, 1000 * attempt));
          }
        }
      };

      const worker = async () => {
        for (let job; !failed && (job = queue.shift());) {
          const buf = await fetchChunk(job);
          await cache.put(job.url, new Response(buf));
        }
      };
      try {
        await Promise.all([worker(), worker(), worker()]);
      } catch (e) {
        failed = true;
        throw e;
      }

      // The manifest goes in last: its presence marks a complete install.
      await cache.put(key, new Response(JSON.stringify(manifest)));
      for (const k of await caches.keys()) {
        if (k.startsWith(PREFIX) && k !== name) await caches.delete(k);
      }
      if (reg.active) reg.active.postMessage('refresh');
    } catch (e) {
      bar.hidden = true;
      say(e.name === 'QuotaExceededError' ? 'Browser storage is full. Free some space and retry.' : e.message, true);
      button('Retry', install);
      return;
    }
    bar.hidden = true;
    await refresh();
  }

  rm.onclick = async e => {
    e.preventDefault();
    if (!confirm('Remove the downloaded IDE data from this browser?')) return;
    for (const k of await caches.keys()) if (k.startsWith(PREFIX)) await caches.delete(k);
    if (reg.active) reg.active.postMessage('refresh');
    await refresh();
  };

  (async () => {
    if (!window.isSecureContext || !navigator.serviceWorker || !window.caches) {
      say('This needs HTTPS (or localhost) with service workers and Cache Storage.', true);
      return;
    }
    try {
      reg = await navigator.serviceWorker.register('coi-serviceworker.js');
      await navigator.serviceWorker.ready;
      const r = await fetch('data/manifest.json', { cache: 'no-cache' });
      if (!r.ok) throw new Error('data/manifest.json not found (HTTP ' + r.status + ').');
      manifest = await r.json();
      name = PREFIX + manifest.version;
      key = new URL('__manifest__', reg.scope).href;
      await refresh();
    } catch (e) {
      say(e.message, true);
    }
  })();
})();
</script>
</body>
</html>
